name: Build Android APK and AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.29.3"
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: .
        run: flutter pub get

      - name: Prepare release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 --decode > android/app/prt-source.jks
          FILE_SIZE=$(wc -c < android/app/prt-source.jks)
          echo "Keystore size: ${FILE_SIZE} bytes"
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "ERROR: Keystore file too small. Re-create ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          keytool -importkeystore -noprompt \
            -srckeystore android/app/prt-source.jks \
            -srcstoretype PKCS12 \
            -srcstorepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -destkeystore android/app/prt.jks \
            -deststoretype PKCS12 \
            -deststorepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -J-Dkeystore.pkcs12.legacy=true
          keytool -list -keystore android/app/prt.jks -storetype PKCS12 -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | head -10

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=prt.jks" >> android/key.properties
          echo "storeType=PKCS12" >> android/key.properties

      - name: Build APK
        env:
          JAVA_TOOL_OPTIONS: -Dkeystore.pkcs12.legacy=true
        run: flutter build apk --release

      - name: Build AAB
        env:
          JAVA_TOOL_OPTIONS: -Dkeystore.pkcs12.legacy=true
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bicholan-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: bicholan-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
